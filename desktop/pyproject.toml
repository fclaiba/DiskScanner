# Tooling config only (the app is not a packaged distribution).

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", "dist_nuitka"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "cleanup_engine", "licensing", "main", "scanner_logic", "conftest"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff.format]
quote-style = "preserve"
