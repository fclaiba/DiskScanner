# Builds the Windows desktop app and publishes it to a GitHub Release.
# See desktop/BUILD.md ("Release automático") for the required secrets.
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    env:
      # Baked into licensing.py by build.py (see build_release.stage_sources).
      DISKSCANNER_API_URL: ${{ secrets.DISKSCANNER_API_URL }}
      DISKSCANNER_ENTITLEMENT_PUBKEY: ${{ secrets.DISKSCANNER_ENTITLEMENT_PUBKEY }}
      # Only used to decide whether the optional signing step runs.
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            desktop/requirements.txt
            desktop/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check release secrets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if (-not $env:DISKSCANNER_ENTITLEMENT_PUBKEY) {
            Write-Error "Secret DISKSCANNER_ENTITLEMENT_PUBKEY is not set - a release build could never unlock Pro."
            exit 1
          }

      - name: Lint
        run: ruff check .

      - name: Test
        # Tests use their own throwaway keys/URL; don't leak the release ones in.
        env:
          DISKSCANNER_API_URL: ""
          DISKSCANNER_ENTITLEMENT_PUBKEY: ""
        run: python -m pytest -q

      - name: Build (PyInstaller)
        run: python build.py --ci

      - name: Sign executable (optional)
        if: env.WINDOWS_CERT_PFX != ''
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 /d "DiskScanner Turbo" dist\DiskScannerTurbo.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa dist\DiskScannerTurbo.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: SHA-256
        run: |
          $hash = (Get-FileHash dist\DiskScannerTurbo.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DiskScannerTurbo.exe" | Out-File -Encoding ascii -NoNewline dist\DiskScannerTurbo.exe.sha256
          Get-Content dist\DiskScannerTurbo.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskScannerTurbo-${{ github.ref_name }}
          path: |
            desktop/dist/DiskScannerTurbo.exe
            desktop/dist/DiskScannerTurbo.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/DiskScannerTurbo.exe
            desktop/dist/DiskScannerTurbo.exe.sha256
          generate_release_notes: true
